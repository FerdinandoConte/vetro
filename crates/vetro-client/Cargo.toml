[package]
name = "vetro-client"
description = "Vetro Android client core (cdylib): transport, reassembly, decode, input, JNI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# cdylib is loaded by the Android app as libvetro_client.so; rlib lets x86 tests link it.
crate-type = ["cdylib", "rlib"]
