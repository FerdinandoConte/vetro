[package]
name = "vetro-encode"
description = "Vetro Encoder trait and FFmpeg backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
vetro-protocol = { path = "../vetro-protocol" }

# FFmpeg itself is never a build dependency: its LGPL DLLs are loaded at run time
# (ADR-0005, ADR-0014) through `LoadLibraryExW`, and D3D11 is the zero-copy surface.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # QueryThreadCycleTime, for the encode_bench example (R9).
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# Already in the tree through vetro-protocol's tests.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
