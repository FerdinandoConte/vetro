[package]
name = "vetro-protocol"
description = "Vetro wire messages, framing, FEC and versioning (no I/O, platform-independent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
reed-solomon-simd = "3.1.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
proptest-derive = "0.8.0"
