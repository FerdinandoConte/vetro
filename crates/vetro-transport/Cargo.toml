[package]
name = "vetro-transport"
description = "Vetro QUIC transport: pinned mutual TLS, pairing, congestion control, socket adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
vetro-protocol = { path = "../vetro-protocol" }
bytes = "1.12.2"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Only to name `RttEstimator` in the `Controller` impl; the same crate quinn already uses.
quinn-proto = { version = "0.11.19", default-features = false }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
socket2 = "0.6.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
